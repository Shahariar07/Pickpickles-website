server {
    listen 80;
    server_name pickpickles.xyz www.pickpickles.xyz;

    client_max_body_size 50M;

    # ============================================
    # Gzip High-Speed Compression
    # ============================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;

    # ============================================
    # Static Files (CSS, JS, Fonts) - 1 Year Cache
    # ============================================
    location /static/ {
        alias /var/www/pickpickles/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ============================================
    # Media Files (Product WebP Images, Jars) - 30 Days Cache
    # ============================================
    location /media/ {
        alias /var/www/pickpickles/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Pass all other requests to Gunicorn socket
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn_pickpickles.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

