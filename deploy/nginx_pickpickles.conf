server {
    listen 80;
    server_name pickpickles.xyz www.pickpickles.xyz;

    client_max_body_size 50M;

    # Static files served directly by Nginx for high performance
    location /static/ {
        alias /var/www/pickpickles/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Media files (Product uploads, banners)
    location /media/ {
        alias /var/www/pickpickles/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Pass all other requests to Gunicorn socket
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn_pickpickles.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
